apiVersion: apps/v1
kind: Deployment
metadata:
  name: mplads-backend
  labels:
    app: mplads-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mplads-backend
  template:
    metadata:
      labels:
        app: mplads-backend
    spec:
      containers:
      - name: backend
        image: mplads-backend:latest
        ports:
        - containerPort: 8000

