providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
NIXPACKS_NODE_VERSION = "20"
CI = "false"

[phases.setup]
nixPkgs = ["...", "nodejs_20"]

[phases.build]
cmds = [
  "cd frontend && npm install && npm run build"
]

[start]
cmd = "uvicorn src.backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"
